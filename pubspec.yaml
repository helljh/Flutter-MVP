name: mvp_game
description: "Memory Vision Patter Game"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  animated_text_kit: ^4.2.2
  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  go_router: ^14.8.1
  provider: ^6.1.1
  get_it: ^7.6.4
  google_mobile_ads: ^6.0.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - .env

  fonts:
    - family: Binggrae
      fonts:
        - asset: assets/fonts/Binggrae-Bold.ttf
          weight: 700
        - asset: assets/fonts/Binggrae.ttf
          weight: 400